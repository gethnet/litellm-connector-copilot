name: Release

on:
  push:
    tags:
      - 'rel/v*'
  release:
    types: [published]

jobs:
  ci:
    # Trigger on either a tag push or a release publication
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rel/v')
    uses: gethnet/litellm-connector-copilot/.github/workflows/ci.yml@main
    secrets: inherit

  create-draft-release:
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Verify Version Match
        run: |
          PACKAGE_VERSION=${{ needs.ci.outputs.version }}
          TAG_VERSION=${GITHUB_REF#refs/tags/rel/v}
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: Tag version $TAG_VERSION does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Download VSIX
        uses: actions/download-artifact@v8
        with:
          name: vsix
          path: .

      - name: Create Draft Release
        uses: softprops/action-gh-release@v3
        with:
          files: "litellm-connector-copilot-${{ needs.ci.outputs.version }}.vsix"
          draft: true
          prerelease: ${{ contains(needs.ci.outputs.version, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # NOTE: Marketplace and Open VSX publish as INDEPENDENT jobs so a failure in
  # one never blocks or re-runs the other. Each can be re-run alone from the
  # Actions UI ("Re-run failed jobs"), and `--skip-duplicate` makes any retry
  # idempotent — the gallery and Open VSX 409 duplicate versions instead of
  # double-publishing. This matters for billed Actions minutes: previously a
  # late Open VSX failure failed the shared job AFTER Marketplace had already
  # published, forcing a full re-run (re-billing the CI build) to retry just
  # the one registry.
  publish-marketplace:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download VSIX from Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${{ github.event.release.tag_name }}
          if [ -z "$TAG_NAME" ]; then
            echo "Missing tag name from release event"
            exit 1
          fi
          if [[ ! "$TAG_NAME" =~ ^rel/v ]]; then
            echo "Release tag must start with rel/v. Got: $TAG_NAME"
            exit 1
          fi

          # Download the VSIX asset attached to the release
          gh release download "$TAG_NAME" --pattern "litellm-connector-copilot-*.vsix" --dir .

          # Validate exactly one VSIX file was downloaded
          VSIX_COUNT=$(ls -1 litellm-connector-copilot-*.vsix 2>/dev/null | wc -l)
          if [ "$VSIX_COUNT" -ne 1 ]; then
            echo "Expected exactly one VSIX asset, found $VSIX_COUNT"
            ls -l litellm-connector-copilot-*.vsix 2>/dev/null || true
            exit 1
          fi

          VSIX_FILE=$(ls -1 litellm-connector-copilot-*.vsix)
          FILE_VERSION=${VSIX_FILE#litellm-connector-copilot-}
          FILE_VERSION=${FILE_VERSION%.vsix}

          TAG_VERSION=${TAG_NAME#rel/v}
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "VSIX version $FILE_VERSION does not match tag version $TAG_VERSION"
            exit 1
          fi

          echo "VSIX_FILE=$VSIX_FILE" >> $GITHUB_ENV

      # NOTE: this job never runs `npm install`, so an unscoped `npx vsce`
      # silently resolves the deprecated vsce@2.15.0 from the registry — a
      # 2022-era tool with a hard 3-minute socket timeout and no retry. A
      # transient Marketplace handshake stall (>3 min on /_apis/gallery) then
      # hard-fails the release (see rel/v2.5.6 attempts 1-2). The scoped,
      # pinned @vscode/vsce + retry loop + --skip-duplicate (retries are
      # idempotent; the gallery 409s duplicate versions) makes publishes
      # resilient to transient Marketplace outages. The pin tracks the
      # devDependency (@vscode/vsce ^4.0.0) — bump both together.
      - name: Publish to VS Code Marketplace
        if: |
          !contains(github.event.release.tag_name, 'dev') &&
          !contains(github.event.release.tag_name, 'test')
        env:
          VS_MARKETPLACE_PUB_TOKEN: ${{ secrets.VS_MARKETPLACE_PUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if npx --yes @vscode/vsce@4.0.0 publish --packagePath "$VSIX_FILE" -p "$VS_MARKETPLACE_PUB_TOKEN" --no-dependencies --skip-duplicate; then
              echo "Marketplace publish succeeded on attempt $attempt."
              exit 0
            fi
            echo "Marketplace publish attempt $attempt failed; retrying in 60s."
            sleep 60
          done
          echo "Marketplace publish failed after 3 attempts."
          exit 1

  publish-openvsx:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download VSIX from Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${{ github.event.release.tag_name }}
          if [ -z "$TAG_NAME" ]; then
            echo "Missing tag name from release event"
            exit 1
          fi
          if [[ ! "$TAG_NAME" =~ ^rel/v ]]; then
            echo "Release tag must start with rel/v. Got: $TAG_NAME"
            exit 1
          fi

          # Download the VSIX asset attached to the release
          gh release download "$TAG_NAME" --pattern "litellm-connector-copilot-*.vsix" --dir .

          # Validate exactly one VSIX file was downloaded
          VSIX_COUNT=$(ls -1 litellm-connector-copilot-*.vsix 2>/dev/null | wc -l)
          if [ "$VSIX_COUNT" -ne 1 ]; then
            echo "Expected exactly one VSIX asset, found $VSIX_COUNT"
            ls -l litellm-connector-copilot-*.vsix 2>/dev/null || true
            exit 1
          fi

          VSIX_FILE=$(ls -1 litellm-connector-copilot-*.vsix)
          FILE_VERSION=${VSIX_FILE#litellm-connector-copilot-}
          FILE_VERSION=${FILE_VERSION%.vsix}

          TAG_VERSION=${TAG_NAME#rel/v}
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "VSIX version $FILE_VERSION does not match tag version $TAG_VERSION"
            exit 1
          fi

          echo "VSIX_FILE=$VSIX_FILE" >> $GITHUB_ENV

      - name: Publish to Open VSX Registry
        if: |
          !contains(github.event.release.tag_name, 'dev') &&
          !contains(github.event.release.tag_name, 'test')
        env:
          OPENVSX_TOKEN: ${{ secrets.OPENVSX_REGISTRY }}
        run: |
          for attempt in 1 2 3; do
            if npx --yes ovsx@1.1.1 publish "$VSIX_FILE" -p "$OPENVSX_TOKEN" --skip-duplicate; then
              echo "Open VSX publish succeeded on attempt $attempt."
              exit 0
            fi
            echo "Open VSX publish attempt $attempt failed; retrying in 60s."
            sleep 60
          done
          echo "Open VSX publish failed after 3 attempts."
          exit 1
