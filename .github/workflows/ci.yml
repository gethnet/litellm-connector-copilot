name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - dev
      - fix/**
      - bugfix/**
      - enhance/**
      - feat/**
      - dev/*
  pull_request:
    branches:
      - main
      - dev
  workflow_call:
    outputs:
      version:
        description: "The version of the extension"
        value: ${{ jobs.build-and-test.outputs.version }}

jobs:
  minimum-vscode-host:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}-build-container:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: npm install --include dev

      - name: Test coverage runner options
        run: node --test scripts/test/*.test.mjs

      - name: Run full suite on minimum VS Code host
        run: npm run test:coverage -- --minimum-host

      # Explicit files and disabled discovery prevent the two host reports
      # from being accidentally uploaded under the wrong flag.
      - name: Upload minimum-host coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ${{ github.workspace }}/.vscode-test/minimum/coverage/lcov.info
          disable_search: true
          flags: vscode-minimum
          name: vscode-minimum-coverage
          fail_ci_if_error: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.user.login != 'app/dependabot' }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload minimum-host test results to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: ${{ github.workspace }}/.vscode-test/minimum/test-results/test-results.xml
          disable_search: true
          flags: vscode-minimum
          name: vscode-minimum-tests
          report_type: test_results
          fail_ci_if_error: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.user.login != 'app/dependabot' }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload minimum host results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: minimum-vscode-host-results
          path: |
            .vscode-test/minimum/test-results/
            .vscode-test/minimum/coverage/
            .vscode-test/minimum/user-data/logs/
          include-hidden-files: true
          retention-days: 7

  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}-build-container:latest

    outputs:
      version: ${{ steps.package_info.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Dependencies
        run: npm install --include dev

      - name: CI Pipeline
        run: npm run test:coverage && npm run package:marketplace
        env:
          VSCODE_TEST_RESULTS_DIR: ${{ github.workspace }}/test-results
          POSTHOG_MOCK: true

      # NOTE: Dependabot PRs are treated like fork PRs — they never receive
      # secrets, so CODECOV_TOKEN is absent and the upload fails with
      # "Token required because branch is protected". Do not let that
      # cosmetic upload failure gate Dependabot dependency bumps; the build
      # and test steps themselves still gate the merge.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ${{ github.workspace }}/coverage/lcov.info
          disable_search: true
          flags: vscode-insiders
          name: vscode-insiders-coverage
          fail_ci_if_error: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.user.login != 'app/dependabot' }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: ${{ github.workspace }}/test-results/test-results.xml
          disable_search: true
          flags: vscode-insiders
          name: vscode-insiders-tests
          report_type: test_results
          fail_ci_if_error: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.user.login != 'app/dependabot' }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Get Package Info
        id: package_info
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: litellm-connector-copilot-${{ steps.package_info.outputs.version }}.vsix
          retention-days: 7

      - name: Upload Coverage Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            ${{ github.workspace }}/test-results/test-results.xml
            .vscode-test/user-data/logs
          retention-days: 7
